# =============================================================
#  docker-compose.dev.yml
#  Entorno de DESARROLLO con hot-reload de Vite
#
#  Uso: docker compose -f docker-compose.dev.yml up
#  Visita: http://localhost:5173
# =============================================================

services:
  app:
    image: node:20-alpine
    container_name: react-interview-prep-dev
    working_dir: /app
    # Monta el código fuente para que Vite detecte cambios (hot-reload)
    volumes:
      - .:/app
      # volumen anónimo para node_modules → no se sobreescribe con el del host
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true   # necesario para hot-reload en Docker/Windows
      - VITE_HOST=0.0.0.0
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
