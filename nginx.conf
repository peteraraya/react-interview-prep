# =============================================================
#  nginx.conf - Configuración para SPA (React + Vite)
#  - Soporte de rutas de React Router (history fallback)
#  - Gzip para transferencias más rápidas
#  - Caché de archivos estáticos versionados
# =============================================================

server {
    listen 80;
    server_name _;

    # Raíz donde se copió el build de Vite
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (si en el futuro hay uploads)
    client_max_body_size 20M;

    # ----- Gzip -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ----- Archivos estáticos versionados (assets con hash) -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ----- Service Worker (si algún día se usa PWA) -----
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----- Fallback para SPA (React Router) -----
    # Cualquier ruta que no sea un archivo real devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Seguridad: headers básicos -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ----- Manejo de errores -----
    error_page 404 /index.html;
}
